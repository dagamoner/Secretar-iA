version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: secretaria_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-secretaria_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-secretaria_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - secretaria_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: secretaria_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_2026}@db:5432/${POSTGRES_DB:-secretaria_db}
      - PROJECT_NAME=Secretar-iA
      - BACKEND_CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000","*"]
    ports:
      - "8000:8000"
    networks:
      - secretaria_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: secretaria_frontend
    restart: always
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    ports:
      - "3000:3000"
    networks:
      - secretaria_net

volumes:
  postgres_data:
    driver: local

networks:
  secretaria_net:
    driver: bridge
